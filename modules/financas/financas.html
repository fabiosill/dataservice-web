<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="icon" href="../../assets/img/dataservicelogonav.png">
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-financas">
        <div class="breadcrumb">Financeiro <span class="sep">/</span> <span>Finanças</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Finanças</div>
            <div class="page-subtitle">Controle financeiro por departamento</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-lancamento')">+ Novo Lançamento</button>
        </div>

        <div class="kpi-grid" style="margin-bottom:20px;">
          <div class="kpi-card green"><div class="kpi-icon">📈</div><div class="kpi-label">Total Rendimento</div><div class="kpi-value" id="fin-rend">—</div></div>
          <div class="kpi-card red"><div class="kpi-icon">📉</div><div class="kpi-label">Total Gastos</div><div class="kpi-value" id="fin-gasto">—</div></div>
          <div class="kpi-card blue"><div class="kpi-icon">💼</div><div class="kpi-label">Total Verba</div><div class="kpi-value" id="fin-verba">—</div></div>
          <div class="kpi-card yellow"><div class="kpi-icon">💡</div><div class="kpi-label">Saldo Líquido</div><div class="kpi-value" id="fin-saldo">—</div></div>
        </div>

        <div class="card">
          <div class="table-wrap"><table id="financas-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Novo Lançamento -->
<div class="modal-overlay" id="modal-lancamento" onclick="closeModalOutside(event,'modal-lancamento')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Lançamento</div>
      <button class="modal-close" onclick="closeModal('modal-lancamento')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field"><label class="form-label">Departamento</label><input class="form-input" id="lanc-dept" placeholder="Ex: TI"></div>
      <div class="form-field"><label class="form-label">Mês</label><input class="form-input" id="lanc-mes" placeholder="Ex: Maio 2025"></div>
      <div class="form-field"><label class="form-label">Verba (R$)</label><input class="form-input" id="lanc-verba" type="number" placeholder="0,00"></div>
      <div class="form-field"><label class="form-label">Rendimento (R$)</label><input class="form-input" id="lanc-rendimento" type="number" placeholder="0,00"></div>
      <div class="form-field form-full"><label class="form-label">Gastos Totais (R$)</label><input class="form-input" id="lanc-gastos" type="number" placeholder="0,00"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-lancamento')">Cancelar</button>
      <button class="action-btn primary" id="btn-salvar-lancamento">💾 Salvar Lançamento</button>
    </div>
  </div>
</div>

<script src="../../core/data.js"></script>
<script src="../../core/shell.js"></script>
<script src="financas.js"></script>
</body>
</html>
