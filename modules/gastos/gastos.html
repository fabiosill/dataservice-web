<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="icon" href="../../assets/img/dataservicelogonav.png">
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-gastos">
        <div class="breadcrumb">Financeiro <span class="sep">/</span> <span>Gastos</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Gastos</div>
            <div class="page-subtitle">Controle de despesas</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-gasto')">+ Registrar Gasto</button>
        </div>

        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
          <div class="kpi-card red"><div class="kpi-icon">💸</div><div class="kpi-label">Total Gastos</div><div class="kpi-value" id="gasto-total">—</div></div>
          <div class="kpi-card blue"><div class="kpi-icon">📋</div><div class="kpi-label">Lançamentos</div><div class="kpi-value" id="gasto-count">—</div></div>
          <div class="kpi-card yellow"><div class="kpi-icon">👤</div><div class="kpi-label">Responsáveis</div><div class="kpi-value">4</div></div>
        </div>

        <div class="card">
          <div class="table-wrap"><table id="gastos-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Registrar Gasto -->
<div class="modal-overlay" id="modal-gasto" onclick="closeModalOutside(event,'modal-gasto')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Registrar Gasto</div>
      <button class="modal-close" onclick="closeModal('modal-gasto')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field"><label class="form-label">Nome</label><input class="form-input" placeholder="Ex: Licença Software"></div>
      <div class="form-field"><label class="form-label">Valor (R$)</label><input class="form-input" type="number" placeholder="0,00"></div>
      <div class="form-field form-full"><label class="form-label">Descrição</label><input class="form-input" placeholder="Detalhe o gasto..."></div>
      <div class="form-field"><label class="form-label">Departamento</label>
        <select class="form-select"><option>TI</option><option>RH</option><option>Vendas</option><option>Financeiro</option><option>Marketing</option></select>
      </div>
      <div class="form-field"><label class="form-label">Responsável</label>
        <select class="form-select"><option>Selecione...</option></select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-gasto')">Cancelar</button>
      <button class="action-btn primary" onclick="saveAndClose('modal-gasto')">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="../../core/data.js"></script>
<script src="../../core/shell.js"></script>
<script src="gastos.js"></script>
</body>
</html>
