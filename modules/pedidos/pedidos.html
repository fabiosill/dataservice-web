<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-pedidos">
        <div class="breadcrumb">Comercial <span class="sep">/</span> <span>Pedidos</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Pedidos</div>
            <div class="page-subtitle">Gestão de vendas</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-pedido')">+ Novo Pedido</button>
        </div>

        <div class="kpi-grid" style="margin-bottom:20px;">
          <div class="kpi-card blue"><div class="kpi-label">Total Pedidos</div><div class="kpi-value" id="ped-total">—</div></div>
          <div class="kpi-card green"><div class="kpi-label">Aprovados</div><div class="kpi-value" id="ped-aprov">—</div></div>
          <div class="kpi-card yellow"><div class="kpi-label">Pendentes</div><div class="kpi-value" id="ped-pend">—</div></div>
          <div class="kpi-card red"><div class="kpi-label">Cancelados</div><div class="kpi-value" id="ped-canc">—</div></div>
        </div>

        <div class="card">
          <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
            <input class="form-input" placeholder="🔍 Buscar pedidos..." style="max-width:280px;" oninput="filtrarPedidos(this.value)">
            <select class="form-select" style="max-width:180px;" onchange="filtrarPorStatus(this.value)">
              <option value="">Todos os status</option>
              <option value="Aprovado">Aprovado</option>
              <option value="Pendente">Pendente</option>
              <option value="Cancelado">Cancelado</option>
            </select>
          </div>
          <div class="table-wrap"><table id="pedidos-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Novo Pedido -->
<div class="modal-overlay" id="modal-pedido" onclick="closeModalOutside(event,'modal-pedido')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Pedido</div>
      <button class="modal-close" onclick="closeModal('modal-pedido')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field"><label class="form-label">Cliente</label>
        <select class="form-select" id="ped-cliente-sel"></select>
      </div>
      <div class="form-field"><label class="form-label">Valor Total (R$)</label><input class="form-input" type="number" placeholder="0,00"></div>
      <div class="form-field"><label class="form-label">Desconto (R$)</label><input class="form-input" type="number" placeholder="0,00"></div>
      <div class="form-field"><label class="form-label">Status</label>
        <select class="form-select"><option>Pendente</option><option>Aprovado</option><option>Cancelado</option></select>
      </div>
      <div class="form-field form-full"><label class="form-label">Descrição</label><input class="form-input" placeholder="Descreva o pedido..."></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-pedido')">Cancelar</button>
      <button class="action-btn primary" onclick="saveAndClose('modal-pedido')">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="/core/data.js"></script>
<script src="/core/shell.js"></script>
<script src="pedidos.js"></script>
</body>
</html>
