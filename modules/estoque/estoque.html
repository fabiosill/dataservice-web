<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-estoque">
        <div class="breadcrumb">Estoque <span class="sep">/</span> <span>Armazéns</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Estoque</div>
            <div class="page-subtitle">Controle de armazéns e localizações</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-estoque')">+ Novo Estoque</button>
        </div>

        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
          <div class="kpi-card blue"><div class="kpi-icon">🏭</div><div class="kpi-label">Armazéns</div><div class="kpi-value">3</div></div>
          <div class="kpi-card green"><div class="kpi-icon">📦</div><div class="kpi-label">Total de Itens</div><div class="kpi-value" id="est-total">—</div></div>
          <div class="kpi-card red"><div class="kpi-icon">⚠️</div><div class="kpi-label">Estoque Crítico</div><div class="kpi-value">3</div></div>
        </div>

        <div class="card">
          <div class="table-wrap"><table id="estoque-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Novo Estoque -->
<div class="modal-overlay" id="modal-estoque" onclick="closeModalOutside(event,'modal-estoque')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Estoque</div>
      <button class="modal-close" onclick="closeModal('modal-estoque')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field form-full"><label class="form-label">Nome do Estoque</label><input class="form-input" placeholder="Ex: Almoxarifado Principal"></div>
      <div class="form-field form-full"><label class="form-label">Endereço / Localização</label><input class="form-input" placeholder="Ex: Galpão A, Setor 1"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-estoque')">Cancelar</button>
      <button class="action-btn primary" onclick="saveAndClose('modal-estoque')">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="../../core/data.js"></script>
<script src="../../core/shell.js"></script>
<script src="estoque.js"></script>
</body>
</html>
