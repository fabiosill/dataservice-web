<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-descontos">
        <div class="breadcrumb">Recursos Humanos <span class="sep">/</span> <span>Descontos</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Descontos</div>
            <div class="page-subtitle">Tipos de desconto da folha</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-desconto')">+ Novo Desconto</button>
        </div>
        <div class="card">
          <div class="table-wrap"><table id="descontos-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Novo Desconto -->
<div class="modal-overlay" id="modal-desconto" onclick="closeModalOutside(event,'modal-desconto')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Desconto</div>
      <button class="modal-close" onclick="closeModal('modal-desconto')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field"><label class="form-label">Código</label><input class="form-input" placeholder="Ex: INSS"></div>
      <div class="form-field"><label class="form-label">Nome</label><input class="form-input" placeholder="Ex: Previdência Social"></div>
      <div class="form-field form-full"><label class="form-label">Valor / Percentual</label><input class="form-input" placeholder="Ex: 11% ou R$ 280"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-desconto')">Cancelar</button>
      <button class="action-btn primary" onclick="saveAndClose('modal-desconto')">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="/core/data.js"></script>
<script src="/core/shell.js"></script>
<script src="descontos.js"></script>
</body>
</html>
