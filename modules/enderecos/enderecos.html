<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-enderecos">
        <div class="breadcrumb">Cadastros <span class="sep">/</span> <span>Endereços</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Endereços</div>
            <div class="page-subtitle">Cadastro de endereços</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-endereco')">+ Novo Endereço</button>
        </div>
        <div class="card">
          <div class="table-wrap"><table id="enderecos-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Novo Endereço -->
<div class="modal-overlay" id="modal-endereco" onclick="closeModalOutside(event,'modal-endereco')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Endereço</div>
      <button class="modal-close" onclick="closeModal('modal-endereco')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field form-full"><label class="form-label">Rua</label><input class="form-input" placeholder="Ex: Av. Paulista"></div>
      <div class="form-field"><label class="form-label">Número</label><input class="form-input" placeholder="Ex: 1000"></div>
      <div class="form-field"><label class="form-label">Bairro</label><input class="form-input" placeholder="Ex: Centro"></div>
      <div class="form-field"><label class="form-label">Cidade</label><input class="form-input" placeholder="Ex: São Paulo"></div>
      <div class="form-field"><label class="form-label">UF</label><input class="form-input" placeholder="SP" maxlength="2"></div>
      <div class="form-field"><label class="form-label">CEP</label><input class="form-input" placeholder="00000-000"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-endereco')">Cancelar</button>
      <button class="action-btn primary" onclick="saveAndClose('modal-endereco')">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="../../core/data.js"></script>
<script src="../../core/shell.js"></script>
<script src="enderecos.js"></script>
</body>
</html>
