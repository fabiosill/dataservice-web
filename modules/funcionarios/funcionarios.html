<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataService ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="icon" href="../../assets/img/dataservicelogonav.png">
</head>
<body>
<div id="app" style="display:flex;height:100vh;flex-direction:column;">
  <div id="app-shell"></div>
  <div class="app-body" id="app-body">
    <div class="app-main">

      <div class="page active" id="page-funcionarios">
        <div class="breadcrumb">Recursos Humanos <span class="sep">/</span> <span>Funcionários</span></div>
        <div class="page-header">
          <div>
            <div class="page-title">Funcionários</div>
            <div class="page-subtitle">Gestão de colaboradores</div>
          </div>
          <button class="action-btn primary" onclick="openModal('modal-func')">+ Novo Funcionário</button>
        </div>

        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
          <div class="kpi-card blue"><div class="kpi-icon">👥</div><div class="kpi-label">Total Ativos</div><div class="kpi-value" id="f-total">—</div></div>
          <div class="kpi-card green"><div class="kpi-icon">🟢</div><div class="kpi-label">Presentes Hoje</div><div class="kpi-value">7</div></div>
          <div class="kpi-card yellow"><div class="kpi-icon">🏖️</div><div class="kpi-label">Em Férias</div><div class="kpi-value">3</div></div>
        </div>

        <div class="card">
          <!-- Filtro por departamento -->
          <div class="tabs" id="func-tabs">
            <button class="tab-btn active" onclick="filtrarFuncionarios('todos', this)">Todos</button>
            <button class="tab-btn" onclick="filtrarFuncionarios('TI', this)">TI</button>
            <button class="tab-btn" onclick="filtrarFuncionarios('Vendas', this)">Vendas</button>
            <button class="tab-btn" onclick="filtrarFuncionarios('RH', this)">RH</button>
            <button class="tab-btn" onclick="filtrarFuncionarios('Financeiro', this)">Financeiro</button>
            <button class="tab-btn" onclick="filtrarFuncionarios('Marketing', this)">Marketing</button>
          </div>
          <div class="table-wrap"><table id="func-table"></table></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Novo Funcionário -->
<div class="modal-overlay" id="modal-func" onclick="closeModalOutside(event,'modal-func')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Funcionário</div>
      <button class="modal-close" onclick="closeModal('modal-func')">✕</button>
    </div>
    <div class="form-grid" style="gap:14px;">
      <div class="form-field"><label class="form-label">Nome</label><input class="form-input" placeholder="Nome completo"></div>
      <div class="form-field"><label class="form-label">Cargo</label><input class="form-input" placeholder="Ex: Desenvolvedor Sr."></div>
      <div class="form-field"><label class="form-label">Gênero</label>
        <select class="form-select"><option>Selecione</option><option>M</option><option>F</option><option>Outro</option></select>
      </div>
      <div class="form-field"><label class="form-label">Departamento</label>
        <select class="form-select"><option>TI</option><option>Vendas</option><option>RH</option><option>Financeiro</option><option>Marketing</option></select>
      </div>
      <div class="form-field"><label class="form-label">Salário Bruto (R$)</label><input class="form-input" type="number" placeholder="0,00"></div>
      <div class="form-field"><label class="form-label">Endereço</label>
        <select class="form-select"><option>Selecione...</option></select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
      <button class="action-btn secondary" onclick="closeModal('modal-func')">Cancelar</button>
      <button class="action-btn primary" onclick="saveAndClose('modal-func')">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="../../core/data.js"></script>
<script src="../../core/shell.js"></script>
<script src="funcionarios.js"></script>
</body>
</html>
